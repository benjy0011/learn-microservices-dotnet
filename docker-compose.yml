services:
  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_PASSWORD=postgrespw
    ports:
      - 5432:5432 # HOST(doorway for outside connection):CONTAINER(Postgre port, default is 5432)
    volumes:
      - pgdata:/var/lib/postgresql # default path for Postgres storage
                                    # pgdata:/var/lib/postgresql/data is for other version, pg18 doesnt need /data
  mongodb:
    image: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=mongopw
    ports:
      - 27017:27017 # left 27017 -> open for localhost to connect | right 27017 -> docker connecting to mongdb enginer (hardcoded by author)
    volumes:
      - mongodata:/data/db # author hard coded, same as postgre


  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - 5672:5672
      - 15672:15672 # management port

  
  auction-svc:
    image: benjy0011/auction-svc:latest
    build: 
      context: . # root of application
      dockerfile: src/AuctionService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - RabbitMq__HOST=rabbitmq # match the service name above
      - ConnectionStrings__DefaultConnection=Server=postgres:5432;User Id=postgres;Password=postgrespw;Database=auctions
      - IdentityServiceUrl=http://identity-svc
    ports:
      - 7001:80
    depends_on:
      - postgres
      - rabbitmq



  search-svc:
    image: benjy0011/search-svc:latest
    build: 
      context: .
      dockerfile: src/SearchService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - RabbitMq__HOST=rabbitmq
      - ConnectionStrings__MongoDbConnection=mongodb://root:mongopw@mongodb
      - AuctionServiceUrl=http://auction-svc
    ports:
      - 7002:80 # using same internal 80 port cuz each docker having indivdual internal port
    depends_on:
      - mongodb
      - rabbitmq

volumes:
  pgdata:
  mongodata: